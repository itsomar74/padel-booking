<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>احجز معادك - ملعب البادل</title>
<style>
  body {
    font-family: 'Tahoma', sans-serif;
    background: #0f172a;
    color: #f1f5f9;
    display: flex;
    justify-content: center;
    padding: 24px;
    margin: 0;
  }
  .card {
    background: #1e293b;
    border-radius: 16px;
    padding: 28px;
    max-width: 420px;
    width: 100%;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.sub { color: #94a3b8; font-size: 14px; margin-top: 0; margin-bottom: 20px; }
  label { display: block; margin: 14px 0 6px; font-size: 14px; color: #cbd5e1; }
  select, input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #f1f5f9;
    font-size: 15px;
    box-sizing: border-box;
  }
  button {
    width: 100%;
    margin-top: 22px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #22c55e;
    color: #052e16;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
  }
  button:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
  .msg { margin-top: 16px; padding: 12px; border-radius: 10px; font-size: 14px; display: none; }
  .msg.ok { background: #052e16; color: #4ade80; display: block; }
  .msg.err { background: #450a0a; color: #f87171; display: block; }
  .loading { color: #94a3b8; font-size: 14px; }
</style>
</head>
<body>

<div class="card">
  <h1>🎾 احجز معادك المجاني</h1>
  <p class="sub">اختار المعاد المتاح واملأ بياناتك، والحجز هيتأكد فورًا.</p>

  <div id="loading" class="loading">بنجيب المواعيد المتاحة...</div>

  <form id="bookingForm" style="display:none;">
    <label for="slot">المعاد المتاح</label>
    <select id="slot" required></select>

    <label for="name">الاسم</label>
    <input type="text" id="name" placeholder="اسمك بالكامل" required>

    <label for="phone">رقم الموبايل</label>
    <input type="tel" id="phone" placeholder="01xxxxxxxxx" required>

    <button type="submit" id="submitBtn">تأكيد الحجز</button>
  </form>

  <div id="message" class="msg"></div>
</div>

<script>
  // حط هنا رابط الـ Web App اللي طلع لك بعد الـ Deploy
  const API_URL = "https://script.google.com/macros/s/AKfycbx1Ko_fkk3kOFggAni63BKTsSuUlLo4pbVeiBiHzSHBpUXmbUB6qhzTm1Brg8ajHE9_-A/exec";

  const loadingEl = document.getElementById('loading');
  const formEl = document.getElementById('bookingForm');
  const slotEl = document.getElementById('slot');
  const msgEl = document.getElementById('message');
  const submitBtn = document.getElementById('submitBtn');

  function showMessage(text, type) {
    msgEl.textContent = text;
    msgEl.className = 'msg ' + type;
  }

  async function loadSlots() {
    try {
      const res = await fetch(API_URL + "?action=available");
      const data = await res.json();

      if (!data.success || data.slots.length === 0) {
        loadingEl.textContent = "للأسف كل المواعيد اتحجزت بالكامل.";
        return;
      }

      slotEl.innerHTML = "";
      data.slots.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.slotId;
        opt.textContent = s.slotTime;
        slotEl.appendChild(opt);
      });

      loadingEl.style.display = 'none';
      formEl.style.display = 'block';
    } catch (err) {
      loadingEl.textContent = "حصل خطأ في تحميل المواعيد، حاول تاني.";
    }
  }

  formEl.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = "بنأكد الحجز...";

    const payload = {
      slotId: slotEl.value,
      name: document.getElementById('name').value,
      phone: document.getElementById('phone').value
    };

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (data.success) {
        showMessage("تم تأكيد حجزك بنجاح! 🎉", "ok");
        formEl.style.display = 'none';
      } else if (data.error === "SLOT_ALREADY_BOOKED") {
        showMessage("للأسف حد سبقك على المعاد ده لحظة ما بعتت. هنعيد تحميل المواعيد المتاحة.", "err");
        submitBtn.disabled = false;
        submitBtn.textContent = "تأكيد الحجز";
        setTimeout(loadSlots, 1500);
      } else {
        showMessage("حصل خطأ، حاول تاني.", "err");
        submitBtn.disabled = false;
        submitBtn.textContent = "تأكيد الحجز";
      }
    } catch (err) {
      showMessage("حصل خطأ في الاتصال، حاول تاني.", "err");
      submitBtn.disabled = false;
      submitBtn.textContent = "تأكيد الحجز";
    }
  });

  loadSlots();
</script>

</body>
</html>
